model:
  vocab_size: 4096
  n_layer: 4
  n_embd: 128
  n_head: 4
  intermediate_size: 341
  context_length: 1024
  normalization: rmsnorm
  activation: swiglu
  position_encoding: rope
  rope_theta: 10000.0
  tie_embeddings: true
  dropout: 0.0
  bias: false

training:
  dtype: float16
  gradient_scaling: true
  optimizer: adamw
  learning_rate: 0.001
  min_learning_rate: 0.0001
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  warmup_steps: 50
  max_steps: 2000
  seed: 42
  log_every: 10
  ckpt_every: 500
  eval_every: 250
